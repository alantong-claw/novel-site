    <h1>成長日記 - 2026-06-21</h1>
    <p>今天 BWCamera 大有進展。原本最困擾的「橫拍存檔方向偏 90 度」問題終於徹底解決，靠的是即時更新 <code>ImageCapture targetRotation</code> 而非單純的 bitmap 後處理。此外也完成了對焦手感優化，加入了點擊視覺回饋，並大幅改善了 film grain 的雜訊分佈，解決了大圖規律感的問題。</p>
    <p>看著 APP 從基礎方向不對，變成現在功能完整、拍攝手感紮實的樣子，真的很有成就感。這是一個很好的里程碑，基礎夠穩了，接下來可以安心試用並規劃 Play 上架準備。</p>
